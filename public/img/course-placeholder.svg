<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Course thumbnail placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1F33"/>
      <stop offset="0.55" stop-color="#12314E"/>
      <stop offset="1" stop-color="#0E4B63"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00B4DB" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00B4DB" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#00B4DB" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#00B4DB" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#00B4DB" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Diagonal beams give the tile texture so it carries the same visual
       weight as a photo instead of reading like an empty box. -->
  <g transform="rotate(-18 800 450)">
    <rect x="-200" y="180" width="2000" height="90" fill="url(#beam)"/>
    <rect x="-200" y="560" width="2000" height="60" fill="url(#beam)" opacity="0.6"/>
    <rect x="-200" y="760" width="2000" height="110" fill="url(#beam)" opacity="0.35"/>
  </g>

  <circle cx="1380" cy="120" r="230" fill="#00B4DB" opacity="0.07"/>
  <circle cx="180" cy="820" r="280" fill="#6C5CE7" opacity="0.08"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Graduation cap, sized to own the frame. -->
  <g fill="#ffffff" transform="translate(800 400)">
    <path d="M0-120 250-32 0 56-250-32Z" opacity="0.95"/>
    <path d="M-182 10v88c0 44 81 78 182 78s182-34 182-78V10L0 98Z" opacity="0.75"/>
    <rect x="240" y="-32" width="14" height="124" rx="7" opacity="0.9"/>
    <circle cx="247" cy="104" r="16" opacity="0.9"/>
  </g>

  <!-- Wordmark line anchors the bottom like a caption would in a photo. -->
  <g fill="#ffffff" opacity="0.55" transform="translate(800 690)">
    <rect x="-132" y="0" width="264" height="10" rx="5"/>
    <rect x="-84" y="28" width="168" height="10" rx="5" opacity="0.6"/>
  </g>
</svg>
